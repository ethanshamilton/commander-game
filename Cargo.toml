[package]
name = "commander"
version = "0.6.1"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", features = ["dynamic_linking"] }
rand = "0.10.1"

[features]
dev = ["bevy/dynamic_linking"]

[lints.clippy]
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
